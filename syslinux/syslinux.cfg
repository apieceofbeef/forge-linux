## FORGE Linux -- BIOS / syslinux entry point.
SERIAL 0 115200
UI vesamenu.c32
MENU TITLE FORGE Linux
MENU BACKGROUND splash.png

DEFAULT forge
TIMEOUT 50

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 8
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29

MENU COLOR border       30;44   #40ff7818 #a0000000 std
MENU COLOR title        1;36;44 #ffff7818 #a0000000 std
MENU COLOR sel          7;37;40 #ff000000 #ffff7818 all
MENU COLOR unsel        37;44   #ffffffff #a0000000 std
MENU COLOR help         37;40   #ffdddd00 #00000000 std
MENU COLOR timeout_msg  37;40   #ffffffff #00000000 std
MENU COLOR timeout      1;37;40 #ffff7818 #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #ffff7818 #00000000 std

LABEL forge
MENU LABEL FORGE Linux (x86_64, BIOS)
LINUX boot/x86_64/vmlinuz-linux-zen
INITRD boot/intel-ucode.img,boot/amd-ucode.img,boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G copytoram=n quiet loglevel=3 apparmor=1 security=apparmor zswap.enabled=0 mitigations=auto nowatchdog nmi_watchdog=0 rw

LABEL forge_copytoram
MENU LABEL FORGE Linux (x86_64, BIOS, copy to RAM)
LINUX boot/x86_64/vmlinuz-linux-zen
INITRD boot/intel-ucode.img,boot/amd-ucode.img,boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram quiet loglevel=3 apparmor=1 security=apparmor zswap.enabled=0 mitigations=auto nowatchdog nmi_watchdog=0 rw

LABEL existing
MENU LABEL Boot existing OS
COM32 chain.c32
APPEND hd0 0

LABEL memtest
MENU LABEL Run memtest86+
LINUX boot/memtest86+/memtest.bin

LABEL hdt
MENU LABEL Hardware Information Tool (HDT)
COM32 hdt.c32

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
