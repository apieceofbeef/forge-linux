## FORGE Linux -- GRUB configuration for UEFI / El Torito boot.

set default="0"
set timeout=5
set gfxmode="1920x1080,1366x768,auto"
set gfxpayload="keep"

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod btrfs

# FORGE Linux GRUB theme (see /boot/grub/themes/forge/theme.txt in the
# installed system).  On the live ISO this file lives in the same path
# inside the squashfs root.
set theme="/boot/grub/themes/forge/theme.txt"
export theme

loadfont /boot/grub/fonts/unicode.pf2 2>/dev/null

terminal_input  console
terminal_output gfxterm

# Default kernel command line for the live image.
set fl_cmdline="quiet loglevel=3 apparmor=1 security=apparmor zswap.enabled=0 mitigations=auto nowatchdog nmi_watchdog=0 rw"

# These two variables are substituted by mkarchiso at build time.
set archiso_label="%ARCHISO_LABEL%"
set install_dir="%INSTALL_DIR%"

menuentry "FORGE Linux (x86_64, UEFI)" --class forge --class gnu-linux --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label "${archiso_label}"
    linux  /${install_dir}/boot/x86_64/vmlinuz-linux-zen \
        archisobasedir=${install_dir} archisolabel=${archiso_label} \
        cow_spacesize=4G ${fl_cmdline}
    initrd /${install_dir}/boot/intel-ucode.img \
           /${install_dir}/boot/amd-ucode.img \
           /${install_dir}/boot/x86_64/initramfs-linux-zen.img
}

menuentry "FORGE Linux (x86_64, UEFI, copy to RAM)" --class forge --class gnu-linux --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label "${archiso_label}"
    linux  /${install_dir}/boot/x86_64/vmlinuz-linux-zen \
        archisobasedir=${install_dir} archisolabel=${archiso_label} \
        copytoram ${fl_cmdline}
    initrd /${install_dir}/boot/intel-ucode.img \
           /${install_dir}/boot/amd-ucode.img \
           /${install_dir}/boot/x86_64/initramfs-linux-zen.img
}

menuentry "UEFI Shell" --class efi {
    search --no-floppy --set=root --label "${archiso_label}"
    chainloader /shellx64.efi
}

menuentry "UEFI Firmware Settings" --class settings {
    fwsetup
}

menuentry "System reboot" --class reboot {
    reboot
}

menuentry "System shutdown" --class shutdown {
    halt
}
