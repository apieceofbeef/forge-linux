# /etc/systemd/zram-generator.conf
#
# Configuration consumed by zram-generator(8) (provided by the
# `zram-generator` package).  systemd will materialise a /dev/zram0 device
# at boot, mkswap it, and `swapon` it before reaching multi-user.target.
#
# FORGE Linux ships zram-based swap so that the very low vm.swappiness (10)
# defined in /etc/sysctl.d/99-forge.conf still has a fast, in-RAM,
# compressed swap to spill into under memory pressure -- much faster than
# any on-disk swap file and well-behaved on laptops/SSDs.

[zram0]
# Size the device at 50% of total RAM, capped at 32 GiB to keep ratios
# sensible on machines with very large memory.
zram-size              = min(ram / 2, 32768)

# lz4 trades a small amount of compression ratio for very high throughput,
# which is exactly what we want for a hot swap path on a developer box.
compression-algorithm  = lz4

# Higher priority than any disk-backed swap so the kernel always prefers
# the zram device.
swap-priority          = 100

# Don't mount as a generic filesystem -- this device is swap only.
fs-type                = swap

# Page-cluster of 0 (set in 99-forge.conf) pairs with zram to make
# single-page faults cheap.
