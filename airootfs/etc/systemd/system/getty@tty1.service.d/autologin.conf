# /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# FORGE Linux -- live-ISO only.
#
# Automatically log root into the first virtual terminal (tty1) on the
# live image so the user lands at a shell and can run `forge-install`
# without typing credentials.  Greetd handles the *installed* system; this
# override is shipped only inside airootfs/ and therefore only applies to
# the live image.

[Service]
# Clear any inherited ExecStart and re-issue agetty with --autologin.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
Type=idle
Restart=always
RestartSec=0
