# ~/.config/helix/config.toml
#
# FORGE Linux default Helix configuration.
# Docs: https://docs.helix-editor.com/configuration.html

theme = "forge"

[editor]
line-number              = "relative"
mouse                    = true
middle-click-paste       = true
scroll-lines             = 3
shell                    = ["zsh", "-c"]
cursorline               = true
cursorcolumn             = false
gutters                  = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
auto-completion          = true
auto-format              = true
auto-save                = false
idle-timeout             = 150
preview-completion-insert = true
completion-trigger-len   = 1
completion-replace       = false
auto-info                = true
true-color               = true
undercurl                = true
rulers                   = [80, 100, 120]
bufferline               = "multiple"
color-modes              = true
text-width               = 100
workspace-lsp-roots      = [".git", "Cargo.toml", "package.json", "pyproject.toml", "go.mod"]
end-of-line-diagnostics  = "hint"
popup-border             = "all"

[editor.statusline]
left  = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
center = ["file-type"]
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
enable                   = true
display-messages         = true
display-progress-messages = true
auto-signature-help      = true
display-inlay-hints      = true
display-signature-help-docs = true
snippets                 = true
goto-reference-include-declaration = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden        = false
follow-symlinks = true
git-ignore     = true
git-global     = true
git-exclude    = true
max-depth      = 8
parents        = true

[editor.indent-guides]
render        = true
character     = "▏"
skip-levels   = 0

[editor.whitespace]
render = "none"

[editor.whitespace.characters]
space    = "·"
nbsp     = "⍽"
tab      = "→"
newline  = "⏎"
tabpad   = "·"

[editor.soft-wrap]
enable       = false
max-wrap     = 25
max-indent-retain = 0
wrap-indicator = "↪ "

[editor.smart-tab]
enable       = true
supersede-menu = false

[editor.inline-diagnostics]
cursor-line  = "hint"
other-lines  = "error"

[editor.search]
smart-case   = true
wrap-around  = true

#############################################################################
# Keybindings (space leader, vim-flavoured)
#############################################################################
[keys.normal]
# File / buffer pickers
"space"."space" = "file_picker"
"space"."f"     = "file_picker"
"space"."F"     = "file_picker_in_current_directory"
"space"."b"     = "buffer_picker"
"space"."j"     = "jumplist_picker"
"space"."/"     = "global_search"
"space"."."     = "command_palette"
"space"."s"     = "symbol_picker"
"space"."S"     = "workspace_symbol_picker"
"space"."d"     = "diagnostics_picker"
"space"."D"     = "workspace_diagnostics_picker"

# Splits
"space"."w"."v" = "vsplit"
"space"."w"."s" = "hsplit"
"space"."w"."h" = "jump_view_left"
"space"."w"."j" = "jump_view_down"
"space"."w"."k" = "jump_view_up"
"space"."w"."l" = "jump_view_right"
"space"."w"."q" = "wclose"
"space"."w"."o" = "wonly"
"space"."w"."=" = "swap_view_left"

# Buffers
"space"."x"     = ":buffer-close"
"space"."X"     = ":buffer-close!"

# LSP
"space"."r"     = "rename_symbol"
"space"."a"     = "code_action"
"space"."k"     = "hover"
"space"."g"."d" = "goto_definition"
"space"."g"."r" = "goto_reference"
"space"."g"."i" = "goto_implementation"
"space"."g"."y" = "goto_type_definition"

# Git
"space"."G"."s" = ":sh lazygit"

# Quick save / quit
"space"."q"     = ":q"
"space"."Q"     = ":q!"
"space"."e"     = ":w"
"space"."E"     = ":w!"

# Comment toggle on visual selection ("," is a common leader for this)
","             = "toggle_comments"

[keys.insert]
"j"."k"   = "normal_mode"
"C-space" = "completion"
"C-l"     = "signature_help"

[keys.select]
","       = "toggle_comments"
"space"."space" = "file_picker"
