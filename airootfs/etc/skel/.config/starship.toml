# ~/.config/starship.toml
#
# FORGE Linux -- powerline prompt with amber/green segments.
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

add_newline   = true
command_timeout = 800
scan_timeout    = 30
continuation_prompt = "▶ ▶ "

format = """
[](#f59e0b)\
[⬡ FORGE](bg:#f59e0b fg:#0d0e10 bold)\
[](fg:#f59e0b bg:#22c55e)\
$os$username$hostname\
[](fg:#22c55e bg:#1c1f25)\
$directory\
[](fg:#1c1f25 bg:#15171b)\
$git_branch$git_status$git_state\
[](fg:#15171b bg:#0d0e10)\
$nodejs$rust$python$golang$lua$java$package\
[](fg:#0d0e10)\
$fill\
[](fg:#15171b)\
$cmd_duration$time\
[](fg:#15171b)
$character"""

right_format = ""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold #f59e0b)"
error_symbol   = "[❯](bold #ef4444)"
vimcmd_symbol  = "[❮](bold #22c55e)"

[os]
disabled = false
style    = "bg:#22c55e fg:#0d0e10 bold"
[os.symbols]
Arch     = ""
Linux    = ""
Macos    = ""
Ubuntu   = ""
Debian   = ""
NixOS    = ""

[username]
show_always = true
format      = "[ $user]($style)"
style_user  = "bg:#22c55e fg:#0d0e10 bold"
style_root  = "bg:#ef4444 fg:#0d0e10 bold"

[hostname]
ssh_only         = false
ssh_symbol       = " 󰣀"
format           = "[@$hostname$ssh_symbol ]($style)"
style            = "bg:#22c55e fg:#0d0e10"
disabled         = false

[directory]
format           = "[ $path ]($style)[$read_only ]($read_only_style)"
style            = "bg:#1c1f25 fg:#f59e0b bold"
read_only        = " 󰌾"
read_only_style  = "bg:#1c1f25 fg:#ef4444"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo  = true
home_symbol      = " "
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "
"Projects"  = " "
"src"       = " "
"~/repos"   = " repos"

[git_branch]
symbol           = " "
format           = "[ $symbol$branch ]($style)"
style            = "bg:#15171b fg:#22c55e bold"
truncation_length = 24
truncation_symbol = "…"

[git_status]
format = '[($all_status$ahead_behind )]($style)'
style  = "bg:#15171b fg:#f59e0b"
conflicted = "= "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked  = "? "
stashed    = "$ "
modified   = "! "
staged     = "+ "
renamed    = "» "
deleted    = "✘ "

[git_state]
format = '[ \($state( $progress_current of $progress_total)\) ]($style)'
style  = "bg:#15171b fg:#ef4444"

[cmd_duration]
min_time         = 200
show_milliseconds = true
format           = "[  $duration ]($style)"
style            = "bg:#15171b fg:#f97316"
disabled         = false

[time]
disabled         = false
time_format      = "%H:%M:%S"
format           = "[ $time ]($style)"
style            = "bg:#15171b fg:#94a3b8"

[memory_usage]
disabled = true

# ---------------------------------------------------------------- languages
[nodejs]
symbol  = " "
format  = "[ $symbol$version ]($style)"
style   = "bg:#0d0e10 fg:#22c55e"
detect_files = ["package.json", ".nvmrc", "node_modules"]

[rust]
symbol  = " "
format  = "[ $symbol$version ]($style)"
style   = "bg:#0d0e10 fg:#f97316"

[python]
symbol      = " "
format      = "[ $symbol$pyenv_prefix($version)( \\($virtualenv\\)) ]($style)"
style       = "bg:#0d0e10 fg:#facc15"
pyenv_version_name = true
detect_extensions = ["py", "ipynb"]

[golang]
symbol  = " "
format  = "[ $symbol$version ]($style)"
style   = "bg:#0d0e10 fg:#22d3ee"

[lua]
symbol  = " "
format  = "[ $symbol$version ]($style)"
style   = "bg:#0d0e10 fg:#3b82f6"

[java]
symbol  = " "
format  = "[ $symbol$version ]($style)"
style   = "bg:#0d0e10 fg:#f87171"

[package]
symbol  = " "
format  = "[ $symbol$version ]($style)"
style   = "bg:#0d0e10 fg:#a3e635"
display_private = false
