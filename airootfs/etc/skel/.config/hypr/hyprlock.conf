# ~/.config/hypr/hyprlock.conf
#
# FORGE Linux -- hyprlock (lock screen) configuration.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

###############################################################################
# General
###############################################################################
general {
    disable_loading_bar      = false
    grace                    = 2
    hide_cursor              = true
    no_fade_in               = false
    no_fade_out              = false
    ignore_empty_input       = false
    immediate_render         = true
    pam_module               = hyprlock
}

###############################################################################
# Background -- live screenshot with heavy blur
###############################################################################
background {
    monitor   =
    path      = screenshot
    blur_passes = 4
    blur_size   = 8
    noise       = 0.0117
    contrast    = 0.9
    brightness  = 0.7
    vibrancy    = 0.18
    vibrancy_darkness = 0.0
}

###############################################################################
# FORGE logo (top banner)
###############################################################################
label {
    monitor   =
    text      = ⬡  FORGE
    color     = rgba(245, 158, 11, 1.0)
    font_size = 56
    font_family = JetBrains Mono Nerd Font Bold
    position  = 0, 320
    halign    = center
    valign    = center
    shadow_passes  = 2
    shadow_size    = 4
    shadow_color   = rgba(0, 0, 0, 0.6)
    shadow_boost   = 1.2
}

###############################################################################
# Clock
###############################################################################
label {
    monitor   =
    text      = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color     = rgba(245, 158, 11, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Bold
    position  = 0, 200
    halign    = center
    valign    = center
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.7)
}

label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color     = rgba(232, 230, 223, 0.92)
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position  = 0, 80
    halign    = center
    valign    = center
}

###############################################################################
# User row -- avatar + name
###############################################################################
label {
    monitor   =
    text      =   $USER
    color     = rgba(34, 197, 94, 1.0)
    font_size = 20
    font_family = JetBrains Mono Nerd Font Bold
    position  = 0, -40
    halign    = center
    valign    = center
}

###############################################################################
# Password input
###############################################################################
input-field {
    monitor              =
    size                 = 400, 56
    outline_thickness    = 2
    dots_size            = 0.30
    dots_spacing         = 0.35
    dots_center          = true
    dots_rounding        = -1

    outer_color          = rgba(245, 158, 11, 0.95)
    inner_color          = rgba(17, 19, 24, 0.85)
    font_color           = rgba(232, 230, 223, 1.0)
    fade_on_empty        = true
    fade_timeout         = 1000

    placeholder_text     = <span foreground="##94a3b8"> Password</span>
    hide_input           = false
    rounding             = 12

    check_color          = rgba(245, 158, 11, 0.95)
    fail_color           = rgba(239, 68, 68, 0.95)
    fail_text            = <span foreground="##ef4444">$FAIL  ($ATTEMPTS)</span>
    fail_transition      = 250
    capslock_color       = rgba(234, 179, 8, 0.95)
    numlock_color        = rgba(59, 130, 246, 0.95)
    bothlock_color       = rgba(168, 85, 247, 0.95)
    invert_numlock       = false
    swap_font_color      = false

    position             = 0, -120
    halign               = center
    valign               = center
}

###############################################################################
# Status hints
###############################################################################
label {
    monitor   =
    text      = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | awk '{print "  " $1 "%"}' || echo '')"
    color     = rgba(148, 163, 184, 1.0)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position  = -40, 40
    halign    = right
    valign    = bottom
}

label {
    monitor   =
    text      = Press Enter to unlock
    color     = rgba(148, 163, 184, 0.75)
    font_size = 13
    font_family = JetBrains Mono Nerd Font
    position  = 0, -200
    halign    = center
    valign    = center
}
