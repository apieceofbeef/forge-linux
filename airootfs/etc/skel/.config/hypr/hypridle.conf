# ~/.config/hypr/hypridle.conf
#
# FORGE Linux -- hypridle (idle daemon) configuration.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
#
# Schedule:
#     5 minutes  → screen lock      (hyprlock)
#    10 minutes  → displays off     (hyprctl dispatch dpms off)
#    15 minutes  → system suspend   (systemctl suspend)
#
# All listeners gate on a single "lock_app = hyprlock" general directive
# so that resuming any input wakes the displays via dpms on.

general {
    lock_cmd      = pidof hyprlock || hyprlock          # only one instance
    before_sleep_cmd = loginctl lock-session            # lock first, then suspend
    after_sleep_cmd  = hyprctl dispatch dpms on         # wake displays after resume
    ignore_dbus_inhibit       = false
    ignore_systemd_inhibit    = false
}

# 5 min -> lock screen
listener {
    timeout      = 300
    on-timeout   = loginctl lock-session
}

# 10 min -> turn displays off
listener {
    timeout      = 600
    on-timeout   = hyprctl dispatch dpms off
    on-resume    = hyprctl dispatch dpms on
}

# 15 min -> suspend (only if AC is unplugged on laptops)
listener {
    timeout      = 900
    on-timeout   = systemctl suspend
}

# Dim screen 30 s before lock as a visual warning.
listener {
    timeout      = 270
    on-timeout   = brightnessctl --save set 10%
    on-resume    = brightnessctl --restore
}

# Dim keyboard backlight if present, otherwise no-op.
listener {
    timeout      = 270
    on-timeout   = brightnessctl -sd rgb:kbd_backlight set 0 2>/dev/null || true
    on-resume    = brightnessctl -rd rgb:kbd_backlight 2>/dev/null      || true
}
