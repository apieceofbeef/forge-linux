# ~/.config/hypr/hyprland.conf
#
# FORGE Linux -- default Hyprland configuration.
# Documentation: https://wiki.hyprland.org/

################################################################################
# Monitors -- auto-detect everything at preferred mode / refresh rate
################################################################################
monitor = , preferred, auto, 1

################################################################################
# Wayland / toolkit environment
################################################################################
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GTK_USE_PORTAL,1
env = NIXOS_OZONE_WL,1
env = EDITOR,hx
env = VISUAL,hx
env = TERMINAL,ghostty
env = BROWSER,firefox

# NVIDIA-only hints (no-op on other GPUs).
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,0

################################################################################
# Startup (one-shots, daemons, portals)
################################################################################
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swayidle -w timeout 600 'hyprlock' timeout 900 'systemctl suspend'
exec-once = nm-applet --indicator

################################################################################
# Input -- caps becomes escape, sensible defaults, touchpad NS+ tap+drag
################################################################################
input {
    kb_layout       = us
    kb_options      = caps:escape,compose:ralt
    follow_mouse    = 1
    sensitivity     = 0
    accel_profile   = flat
    repeat_rate     = 40
    repeat_delay    = 250

    touchpad {
        natural_scroll      = yes
        disable_while_typing = yes
        tap-to-click        = yes
        drag_lock           = yes
        clickfinger_behavior = yes
        scroll_factor       = 0.7
    }
}

gestures {
    workspace_swipe                = on
    workspace_swipe_fingers        = 3
    workspace_swipe_distance       = 220
    workspace_swipe_invert         = false
    workspace_swipe_cancel_ratio   = 0.4
}

cursor {
    inactive_timeout = 6
    no_warps         = false
}

################################################################################
# Look & feel
################################################################################
general {
    gaps_in              = 4
    gaps_out             = 8
    border_size          = 2

    # Amber → green active border gradient, muted neutral for inactive.
    col.active_border    = rgba(f59e0bff) rgba(22c55eff) 45deg
    col.inactive_border  = rgba(2a2d33aa)

    layout               = dwindle
    resize_on_border     = true
    allow_tearing        = false
    no_focus_fallback    = true
}

decoration {
    rounding = 10

    blur {
        enabled        = true
        size           = 6
        passes         = 3
        new_optimizations = true
        ignore_opacity = true
        xray           = false
        vibrancy       = 0.1696
    }

    shadow {
        enabled       = true
        range         = 18
        render_power  = 3
        color         = rgba(0d0e10cc)
        color_inactive = rgba(0d0e1080)
    }

    active_opacity   = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0
    dim_inactive     = false
}

################################################################################
# Animations -- custom bezier curves
################################################################################
animations {
    enabled = yes

    bezier = forgeOvershoot, 0.05, 0.9, 0.1, 1.15
    bezier = forgeEase,      0.25, 0.46, 0.45, 0.94
    bezier = forgeSpring,    0.6, 0.0, 0.4, 1.0
    bezier = forgePop,       0.16, 1.0, 0.3, 1.0

    animation = windows,        1, 6,  forgeOvershoot, slide
    animation = windowsOut,     1, 5,  forgeEase,      slide
    animation = windowsMove,    1, 5,  forgeSpring
    animation = border,         1, 10, forgeEase
    animation = borderangle,    1, 80, forgeEase, loop
    animation = fade,           1, 5,  forgeEase
    animation = workspaces,     1, 6,  forgeSpring,    slide
    animation = specialWorkspace, 1, 6, forgePop,      slidevert
    animation = layers,         1, 4,  forgePop,       slide
}

################################################################################
# Layout
################################################################################
dwindle {
    pseudotile      = yes
    preserve_split  = yes
    smart_split     = no
    smart_resizing  = yes
    force_split     = 2
    special_scale_factor = 0.95
}

master {
    new_status      = master
    mfact           = 0.55
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    enable_swallow          = true
    swallow_regex           = ^(ghostty|foot|kitty|Alacritty)$
    focus_on_activate       = true
    animate_manual_resizes  = true
    vfr                     = true
    vrr                     = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
    new_window_takes_over_fullscreen = 2
}

################################################################################
# Window rules
################################################################################
# Floats
windowrulev2 = float,            class:^(pavucontrol)$
windowrulev2 = float,            class:^(blueman-manager)$
windowrulev2 = float,            class:^(nm-connection-editor)$
windowrulev2 = float,            class:^(mpv)$
windowrulev2 = float,            class:^(imv)$
windowrulev2 = float,            class:^(file_progress)$
windowrulev2 = float,            class:^(confirm)$
windowrulev2 = float,            class:^(dialog)$
windowrulev2 = float,            class:^(download)$
windowrulev2 = float,            class:^(notification)$
windowrulev2 = float,            class:^(error)$
windowrulev2 = float,            class:^(splash)$
windowrulev2 = float,            class:^(confirmreset)$
windowrulev2 = float,            title:^(Open File)(.*)$
windowrulev2 = float,            title:^(Save File)(.*)$
windowrulev2 = float,            title:^(Authentication Required)$
windowrulev2 = center,           class:^(pavucontrol|mpv|imv|nm-connection-editor)$
windowrulev2 = size 900 600,     class:^(pavucontrol|mpv|nm-connection-editor)$

# Picture-in-picture
windowrulev2 = float,            title:^(Picture-in-Picture)$
windowrulev2 = pin,              title:^(Picture-in-Picture)$
windowrulev2 = size 480 270,     title:^(Picture-in-Picture)$
windowrulev2 = move 100%-w-20 100%-h-20, title:^(Picture-in-Picture)$

# Scratchpad (dropdown terminal): class "scratchpad" goes to special workspace.
windowrulev2 = workspace special:scratch silent, class:^(scratchpad)$
windowrulev2 = float,            class:^(scratchpad)$
windowrulev2 = size 70% 60%,     class:^(scratchpad)$
windowrulev2 = center,           class:^(scratchpad)$

# Idle inhibit while playing media or in fullscreen.
windowrulev2 = idleinhibit fullscreen, class:.*
windowrulev2 = idleinhibit focus,      class:^(mpv|firefox|chromium)$

# Tearing for games
windowrulev2 = immediate, title:^(.*\.exe)$

# Layer rules
layerrule = blur,             waybar
layerrule = ignorezero,       waybar
layerrule = blur,             rofi
layerrule = ignorezero,       rofi
layerrule = blur,             notifications
layerrule = ignorezero,       notifications
layerrule = blur,             logout_dialog

################################################################################
# Keybindings
################################################################################
$mainMod = SUPER
$term    = ghostty
$menu    = rofi -show drun -theme ~/.config/rofi/forge.rasi
$files   = ghostty -e ranger
$lock    = hyprlock
$browser = firefox

# Core programs
bind = $mainMod,       Return,  exec, $term
bind = $mainMod SHIFT, Return,  exec, $term --class=scratchpad
bind = $mainMod,       Space,   exec, $menu
bind = $mainMod,       E,       exec, $files
bind = $mainMod,       B,       exec, $browser
bind = $mainMod,       L,       exec, $lock
bind = $mainMod,       V,       exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/forge.rasi | cliphist decode | wl-copy

# Window management
bind = $mainMod,       Q,       killactive,
bind = $mainMod SHIFT, Q,       exit,
bind = $mainMod,       F,       fullscreen, 0
bind = $mainMod SHIFT, F,       fullscreen, 1
bind = $mainMod,       T,       togglefloating,
bind = $mainMod,       P,       pseudo,
bind = $mainMod,       J,       togglesplit,
bind = $mainMod SHIFT, S,       togglespecialworkspace, scratch
bind = $mainMod SHIFT, M,       movetoworkspace, special:scratch

# Focus (Vim hjkl)
bind = $mainMod,       h,       movefocus, l
bind = $mainMod,       l,       movefocus, r
bind = $mainMod,       k,       movefocus, u
bind = $mainMod,       j,       movefocus, d

# Move active window (SHIFT + hjkl)
bind = $mainMod SHIFT, h,       movewindow, l
bind = $mainMod SHIFT, l,       movewindow, r
bind = $mainMod SHIFT, k,       movewindow, u
bind = $mainMod SHIFT, j,       movewindow, d

# Resize active window (CTRL + hjkl, 40px steps)
bind = $mainMod CTRL,  h,       resizeactive, -40 0
bind = $mainMod CTRL,  l,       resizeactive,  40 0
bind = $mainMod CTRL,  k,       resizeactive,  0 -40
bind = $mainMod CTRL,  j,       resizeactive,  0  40

# Workspaces 1-10
bind = $mainMod,       1,       workspace, 1
bind = $mainMod,       2,       workspace, 2
bind = $mainMod,       3,       workspace, 3
bind = $mainMod,       4,       workspace, 4
bind = $mainMod,       5,       workspace, 5
bind = $mainMod,       6,       workspace, 6
bind = $mainMod,       7,       workspace, 7
bind = $mainMod,       8,       workspace, 8
bind = $mainMod,       9,       workspace, 9
bind = $mainMod,       0,       workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1,       movetoworkspace, 1
bind = $mainMod SHIFT, 2,       movetoworkspace, 2
bind = $mainMod SHIFT, 3,       movetoworkspace, 3
bind = $mainMod SHIFT, 4,       movetoworkspace, 4
bind = $mainMod SHIFT, 5,       movetoworkspace, 5
bind = $mainMod SHIFT, 6,       movetoworkspace, 6
bind = $mainMod SHIFT, 7,       movetoworkspace, 7
bind = $mainMod SHIFT, 8,       movetoworkspace, 8
bind = $mainMod SHIFT, 9,       movetoworkspace, 9
bind = $mainMod SHIFT, 0,       movetoworkspace, 10

# Cycle workspaces with the scroll wheel
bind = $mainMod,       mouse_down, workspace, e+1
bind = $mainMod,       mouse_up,   workspace, e-1
bind = $mainMod,       Tab,        workspace, e+1
bind = $mainMod SHIFT, Tab,        workspace, e-1

# Mouse drag / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot (grim + slurp + swappy)
bind =          , Print,   exec, grim - | wl-copy
bind = SHIFT    , Print,   exec, grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod , Print,   exec, grim -g "$(slurp -d)" - | swappy -f -
bind = $mainMod SHIFT, Print, exec, grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@   5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume      @DEFAULT_AUDIO_SINK@   5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute        @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute        @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
bindl  = , XF86AudioStop,        exec, playerctl stop

# Backlight
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Power menu
bind = $mainMod, Escape, exec, wlogout -p layer-shell
