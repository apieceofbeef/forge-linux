# ~/.config/hypr/hyprpaper.conf
#
# FORGE Linux -- hyprpaper (wallpaper) configuration.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprpaper/
#
# Drop a wallpaper at ~/.config/hypr/wallpaper.jpg (or change `preload`
# below) and hyprpaper will pick it up on next launch.  If the file does
# not exist, hyprpaper will exit cleanly and Hyprland's solid background
# colour will be visible.

ipc                  = on
splash               = false
splash_offset        = 2.0

preload              = ~/.config/hypr/wallpaper.png

# Apply to every monitor (empty monitor selector = all).
wallpaper            = ,~/.config/hypr/wallpaper.png
