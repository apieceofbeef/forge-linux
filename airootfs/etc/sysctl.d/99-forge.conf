# /etc/sysctl.d/99-forge.conf
#
# FORGE Linux performance + developer-workstation tuning.
# Loaded by systemd-sysctl(8) at boot.  Override individual values by
# dropping a file with a higher numeric prefix into /etc/sysctl.d/.

##############################################################################
# Memory / swap behaviour
##############################################################################
# Avoid swapping unless the system is truly under memory pressure.  Combined
# with the zram device configured in /etc/systemd/zram-generator.conf this
# gives the kernel a fast compressed swap to fall back on.
vm.swappiness                = 10
vm.vfs_cache_pressure        = 50
vm.dirty_ratio               = 10
vm.dirty_background_ratio    = 5
vm.dirty_expire_centisecs    = 3000
vm.dirty_writeback_centisecs = 1500
vm.page-cluster              = 0
vm.max_map_count             = 1048576
vm.min_free_kbytes           = 65536
vm.overcommit_memory         = 1

##############################################################################
# Scheduler / CPU
##############################################################################
kernel.sched_autogroup_enabled = 1
kernel.sched_cfs_bandwidth_slice_us = 3000
kernel.nmi_watchdog            = 0

##############################################################################
# File system / inotify limits (IDEs, file watchers, language servers)
##############################################################################
fs.inotify.max_user_watches    = 1048576
fs.inotify.max_user_instances  = 8192
fs.inotify.max_queued_events   = 32768
fs.file-max                    = 2097152
fs.aio-max-nr                  = 1048576

##############################################################################
# Network: BBR + modern queueing
##############################################################################
net.core.default_qdisc                = cake
net.ipv4.tcp_congestion_control       = bbr
net.ipv4.tcp_fastopen                 = 3
net.ipv4.tcp_mtu_probing              = 1
net.ipv4.tcp_slow_start_after_idle    = 0
net.ipv4.tcp_window_scaling           = 1
net.ipv4.tcp_sack                     = 1
net.ipv4.tcp_dsack                    = 1
net.ipv4.tcp_fack                     = 1
net.ipv4.tcp_low_latency              = 1
net.ipv4.tcp_keepalive_time           = 60
net.ipv4.tcp_keepalive_intvl          = 10
net.ipv4.tcp_keepalive_probes         = 6
net.ipv4.tcp_max_syn_backlog          = 8192
net.ipv4.tcp_syncookies               = 1
net.ipv4.tcp_rfc1337                  = 1
net.ipv4.tcp_timestamps               = 1
net.ipv4.tcp_tw_reuse                 = 1
net.ipv4.tcp_fin_timeout              = 15
net.ipv4.ip_local_port_range          = 1024 65535

##############################################################################
# Network: socket buffers
##############################################################################
net.core.rmem_default                 = 1048576
net.core.rmem_max                     = 16777216
net.core.wmem_default                 = 1048576
net.core.wmem_max                     = 16777216
net.core.optmem_max                   = 65536
net.core.netdev_max_backlog           = 16384
net.core.somaxconn                    = 8192
net.ipv4.tcp_rmem                     = 4096 1048576 16777216
net.ipv4.tcp_wmem                     = 4096 1048576 16777216
net.ipv4.udp_rmem_min                 = 8192
net.ipv4.udp_wmem_min                 = 8192

##############################################################################
# Network: hardening
##############################################################################
net.ipv4.conf.all.rp_filter           = 1
net.ipv4.conf.default.rp_filter       = 1
net.ipv4.conf.all.accept_redirects    = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects    = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects      = 0
net.ipv4.conf.default.send_redirects  = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians        = 1
net.ipv4.icmp_echo_ignore_broadcasts  = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv6.conf.all.accept_redirects    = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

##############################################################################
# Kernel hardening + developer ergonomics
##############################################################################
kernel.kptr_restrict           = 2
kernel.dmesg_restrict          = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden        = 2
kernel.kexec_load_disabled     = 1
kernel.yama.ptrace_scope       = 1
kernel.perf_event_paranoid     = 2
kernel.sysrq                   = 4
kernel.core_uses_pid           = 1
kernel.panic                   = 10
kernel.panic_on_oops           = 1
kernel.pid_max                 = 4194304
