# /etc/mkinitcpio.conf
#
# FORGE Linux initramfs configuration.
# See mkinitcpio.conf(5) for syntax.

##############################################################################
# MODULES
#
# Loaded by the initramfs before HOOKS run.  We pre-load every common GPU
# driver so KMS comes up cleanly during the early boot graphical handoff.
# Unsupported modules are silently skipped at boot.
##############################################################################
MODULES=(amdgpu i915 nvidia nvidia_modeset nvidia_uvm nvidia_drm)

##############################################################################
# BINARIES / FILES
#
# Extra binaries / files to bake into the initramfs.  Empty by default --
# leave these to mkinitcpio-archiso for live builds, and add per-system as
# needed.
##############################################################################
BINARIES=()
FILES=()

##############################################################################
# HOOKS
#
# Order matters.  We use the modern systemd-based hook set:
#
#   base              core busybox-like utilities
#   systemd           run PID 1 inside the initramfs (faster, cleaner)
#   autodetect        shrink the initramfs to modules the live host needs
#   modconf           load /etc/modprobe.d/*.conf
#   kms               start the KMS driver (matches GPU MODULES above)
#   keyboard          load keyboard modules for early prompts (LUKS, etc.)
#   sd-vconsole       set keymap/font in the initramfs console
#   block             block-device modules (LVM/MD/btrfs/dm-crypt)
#   filesystems       FS modules for the root mount
#   fsck              run fsck on the root FS before pivoting
##############################################################################
HOOKS=(base systemd autodetect modconf kms keyboard sd-vconsole block filesystems fsck)

##############################################################################
# COMPRESSION
#
# zstd gives the best decompression speed/ratio trade-off on modern CPUs.
# Bump COMPRESSION_OPTIONS to '(-19 --long)' if you want maximum ratio at
# the cost of CPU time on the build host.
##############################################################################
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 --long)

##############################################################################
# MODULES_DECOMPRESS
#
# Decompress kernel modules in the initramfs so they can be picked up by a
# zstd-compressed kernel image without an additional layer.
##############################################################################
MODULES_DECOMPRESS="yes"
