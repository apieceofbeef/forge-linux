#
# /etc/pacman.conf
#
# FORGE Linux build-time pacman configuration.
# This file is consumed by mkarchiso when building the ISO; it is NOT the
# pacman.conf shipped inside the live system (that one lives under airootfs/).
#

[options]
HoldPkg      = pacman glibc
Architecture = auto

# Pretty output.
Color
ILoveCandy
VerbosePkgLists

# Performance.
ParallelDownloads = 10
DisableDownloadTimeout

# Signature checking.
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional

# Files that should never be overwritten.
NoExtract = usr/share/help/* !usr/share/help/en*
NoExtract = usr/share/gtk-doc/html/* usr/share/doc/gtk-doc/html/*
NoExtract = usr/share/locale/* usr/share/X11/locale/*/* opt/google/chrome/locales/*
NoExtract = !usr/share/X11/locale/C/*
NoExtract = !*locale*/en*/* !usr/share/*locale*/locale.*
NoExtract = !usr/share/X11/locale/compose.dir !usr/share/X11/locale/iso8859-1/*
NoExtract = usr/share/i18n/locales/* !usr/share/i18n/locales/en_?? !usr/share/i18n/locales/i18n*
NoExtract = !usr/share/i18n/locales/iso14651_t1 !usr/share/i18n/locales/iso14651_t1_common
NoExtract = !usr/share/i18n/locales/translit_*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
